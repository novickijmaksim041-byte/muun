  margin: 0;

<body>

<header>
  <div class="logo">✦ TaskFlow</div>
  <a href="https://github.com/" target="_blank">
    GitHub ↗
  </a>
</header>

<main>
  <section class="hero">
    <h1>Твої цілі.<br>
      <span style="color:#58a6ff">Твій прогрес.</span>
    </h1>
    <p>Організуй свій день і досягай більшого!</p>
  </section>

  <section class="panel">
    <h2>Мої завдання</h2>

    <form id="taskForm">
      <input
        type="text"
        id="taskInput"
        placeholder="Що потрібно зробити?"
        maxlength="180"
        required
      >
      <button class="add" type="submit">
        + Додати
      </button>
    </form>

    <div class="filters">
      <button class="filter active" data-filter="all">
        Усі
      </button>
      <button class="filter" data-filter="active">
        Активні
      </button>
      <button class="filter" data-filter="done">
        Виконані
      </button>
    </div>

    <div class="progress-bg">
      <div id="progress"></div>
    </div>

    <p id="stats">Почни з першого завдання!</p>

    <ul id="taskList"></ul>

    <div id="empty">
      ✦<br>
      Тут поки порожньо.<br>
      Додай перше завдання!
    </div>
  </section>
</main>

<footer>
  Створено з ❤️ · TaskFlow
</footer>

<script>
const form = document.getElementById("taskForm");
const input = document.getElementById("taskInput");
const list = document.getElementById("taskList");
const stats = document.getElementById("stats");
const progress = document.getElementById("progress");
const empty = document.getElementById("empty");
const filters = document.querySelectorAll(".filter");

let tasks = [];
let currentFilter = "all";

try {
  tasks = JSON.parse(
    localStorage.getItem("taskflow-tasks") || "[]"
  );

  if (!Array.isArray(tasks)) tasks = [];
} catch {
  tasks = [];
}

function saveTasks() {
  localStorage.setItem(
    "taskflow-tasks",
    JSON.stringify(tasks)
  );
  renderTasks();
}

function renderTasks() {
  list.innerHTML = "";

  const visibleTasks = tasks.filter(task => {
    if (currentFilter === "active") return !task.done;
    if (currentFilter === "done") return task.done;
    return true;
  });

  visibleTasks.forEach(task => {
    const li = document.createElement("li");

    if (task.done) li.classList.add("done");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;
    checkbox.setAttribute(
      "aria-label",
      "Позначити завдання виконаним"
    );

    checkbox.addEventListener("change", () => {
      task.done = checkbox.checked;
      saveTasks();
    });

    const text = document.createElement("span");
    text.textContent = task.text;

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Видалити";
    deleteButton.className = "delete";

    deleteButton.addEventListener("click", () => {
      tasks = tasks.filter(item => item.id !== task.id);
      saveTasks();
    });

    li.append(checkbox, text, deleteButton);
    list.appendChild(li);
  });

  const completed = tasks.filter(task => task.done).length;
  const remaining = tasks.length - completed;

  stats.textContent =
    `Усього: ${tasks.length} | ` +
    `Виконано: ${completed} | ` +
    `Залишилось: ${remaining}`;

  progress.style.width = tasks.length
    ? `${completed / tasks.length * 100}%`
    : "0%";

  empty.style.display =
    visibleTasks.length === 0 ? "block" : "none";

  if (visibleTasks.length === 0) {
    empty.textContent =
      currentFilter === "done"
        ? "Виконаних завдань поки немає."
        : currentFilter === "active" && tasks.length > 0
          ? "Усі завдання виконані! 🎉"
          : "✦ Тут поки порожньо. Додай перше завдання!";
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();

  const text = input.value.trim();

  if (!text) return;

  tasks.unshift({
    id: Date.now().toString() +
        Math.random().toString(16).slice(2),
    text: text,
    done: false
  });

  input.value = "";
  currentFilter = "all";

  filters.forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.filter === "all"
    );
  });

  saveTasks();
  input.focus();
});

filters.forEach(button => {
  button.addEventListener("click", () => {
    currentFilter = button.dataset.filter;

    filters.forEach(item => {
      item.classList.toggle(
        "active",
        item === button
      );
    });

    renderTasks();
  });
});

renderTasks();
</script>

</body>
</html>
